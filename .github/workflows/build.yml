# Сборка готового .exe на облачной Windows-машине — свой компьютер не нужен.
# Как запустить: загрузите проект в репозиторий GitHub → вкладка Actions → "Build Windows" →
# Run workflow. Через 10–15 минут в разделе Artifacts появятся:
#   • Mandarin-Setup  — установщик Mandarin-Setup.exe (двойной клик → установка → запуск)
#   • Mandarin-portable — папка-архив: распакуйте и запустите Mandarin.exe без установки
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"          # вывод и работа с файлами в UTF-8 (иначе кириллица роняет print на Windows)
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller qrcode python-docx

      - name: Run tests
        shell: bash
        run: |
          set +e
          fail=0
          for t in engine pdftools license antitamper sales; do
            echo "========== test_$t ==========" | tee -a tests.log
            python -X utf8 tests/test_$t.py >> tests.log 2>&1
            code=$?
            echo "exit=$code" | tee -a tests.log
            [ $code -ne 0 ] && fail=1
          done
          echo "---- последние строки ----"
          tail -c 6000 tests.log
          exit $fail
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: tests.log
      - name: Publish test log into repo on failure
        if: failure()
        shell: bash
        run: |
          git config user.email "ci@mandarin.local"
          git config user.name "mandarin-ci"
          mkdir -p ci-logs && cp tests.log ci-logs/last-failure.txt
          git add ci-logs/last-failure.txt
          git commit -m "CI: лог упавших тестов [skip ci]" || exit 0
          git push origin HEAD:main

      - name: Build app (бесплатная полная версия)
        env:
          MANDARIN_FREE: "1"
        run: >
          pyinstaller --noconfirm --clean --windowed --name Mandarin --icon mandarin.ico
          --add-data "mandarin.ico;." --add-data "tessdata;tessdata"
          --collect-all tkinterdnd2 --collect-all imageio_ffmpeg
          --collect-all pillow_heif --collect-all pymupdf
          --collect-all pdf2docx --collect-all docx --collect-all pptx --collect-all openpyxl
          --collect-all pyhanko --collect-all pyhanko_certvalidator
          --hidden-import pystray._win32 app.py

      - name: Add uninstaller to portable build
        run: copy uninstall.bat, uninstall.ps1 dist/Mandarin/

      - name: Build installer (Setup.exe)
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Mandarin-Setup
          path: dist-installer/Mandarin-Setup.exe

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: Mandarin-portable
          path: dist/Mandarin

      # Готовые файлы выкладываем в Releases — оттуда их можно скачать по прямой ссылке
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          powershell -NoProfile -Command "Compress-Archive -Path dist/Mandarin/* -DestinationPath Mandarin-portable.zip -Force"
          tag="build-$(date -u +%Y%m%d-%H%M)"
          gh release create "$tag" \
            dist-installer/Mandarin-Setup.exe \
            Mandarin-portable.zip \
            --title "Mandarin — бесплатная версия ($tag)" \
            --notes "Готовая сборка Windows. **Mandarin-Setup.exe** — установщик (двойной клик). **Mandarin-portable.zip** — без установки, распакуйте и запустите Mandarin.exe." \
            --latest
