# Платная защищённая сборка Mandarin на облачной Windows-машине.
# Перед первым запуском добавьте секреты репозитория (Settings → Secrets and variables → Actions):
#   MANDARIN_PEPPER     — «перец» HMAC защиты пробного периода
#   MANDARIN_BUILD_KEY  — закрытый ключ подписи сборки (файл-страж .exe)
# Сборка компилируется Nuitka (машинный код) и подписывается — рядом кладётся Mandarin.exe.sig.
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nuitka qrcode python-docx

      - name: Run tests
        shell: bash
        run: |
          set +e
          fail=0
          for t in engine pdftools license antitamper integrity sales; do
            echo "========== test_$t ==========" | tee -a tests.log
            python -X utf8 tests/test_$t.py >> tests.log 2>&1
            code=$?
            echo "exit=$code" | tee -a tests.log
            [ $code -ne 0 ] && fail=1
          done
          echo "---- последние строки ----"
          tail -c 6000 tests.log
          exit $fail
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: tests.log
      - name: Publish test log into repo on failure
        if: failure()
        shell: bash
        run: |
          git config user.email "ci@mandarin.local"
          git config user.name "mandarin-ci"
          mkdir -p ci-logs && cp tests.log ci-logs/last-failure.txt
          git add ci-logs/last-failure.txt
          git commit -m "CI: лог упавших тестов [skip ci]" || exit 0
          git push origin HEAD:main

      # Секреты сборки: режим «платная» + настоящий перец. Файл _secret.py в репозиторий не попадает.
      - name: Inject build secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.MANDARIN_PEPPER }}" ] || [ -z "${{ secrets.MANDARIN_BUILD_KEY }}" ]; then
            echo "Добавьте секреты MANDARIN_PEPPER и MANDARIN_BUILD_KEY (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          printf 'FREE = "0"\nPEPPER = "%s"\n' "${{ secrets.MANDARIN_PEPPER }}" > _secret.py

      - name: Build app (Nuitka, платная версия)
        run: >
          python -m nuitka --onefile --assume-yes-for-downloads
          --windows-console-mode=disable --enable-plugin=tk-inter
          --windows-icon-from-ico=mandarin.ico
          --include-data-file=mandarin.ico=mandarin.ico
          --include-data-dir=tessdata=tessdata
          --include-module=_secret
          --include-package=tkinterdnd2 --include-package-data=tkinterdnd2
          --include-package=pymupdf --include-package=pdf2docx
          --include-package=docx --include-package=pptx --include-package=openpyxl
          --include-package=pyhanko --include-package=pyhanko_certvalidator
          --include-package=imageio_ffmpeg --include-package-data=imageio_ffmpeg
          --include-package=pillow_heif --include-package-data=pillow_heif
          --output-filename=Mandarin.exe --output-dir=dist app.py

      # Подпись сборки: рядом с .exe появляется Mandarin.exe.sig (файл-страж целостности)
      - name: Sign build
        shell: bash
        env:
          MANDARIN_BUILD_KEY: ${{ secrets.MANDARIN_BUILD_KEY }}
        run: python tools/sign_build.py dist/Mandarin.exe

      - name: Package portable zip
        shell: bash
        run: |
          powershell -NoProfile -Command "Compress-Archive -Path dist/Mandarin.exe,dist/Mandarin.exe.sig,uninstall.bat,uninstall.ps1 -DestinationPath Mandarin-portable.zip -Force"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Mandarin
          path: |
            dist/Mandarin.exe
            dist/Mandarin.exe.sig

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$(date -u +%Y%m%d-%H%M)"
          gh release create "$tag" \
            dist/Mandarin.exe dist/Mandarin.exe.sig Mandarin-portable.zip \
            --title "Mandarin Pro ($tag)" \
            --notes "Платная защищённая сборка. 14 дней бесплатно, затем PDF-Pro требует ключ. **Важно:** держите Mandarin.exe и Mandarin.exe.sig в одной папке — подпись защищает программу от взлома. Mandarin-portable.zip — то же в архиве с деинсталлятором." \
            --latest
