# Платная защищённая сборка Mandarin на облачной Windows-машине.
# Перед первым запуском добавьте секреты репозитория (Settings → Secrets and variables → Actions):
#   MANDARIN_PEPPER     — «перец» HMAC защиты пробного периода
#   MANDARIN_BUILD_KEY  — закрытый ключ подписи сборки (файл-страж .exe)
# Сборка — один защищённый .exe (PyInstaller onefile), который подписывается: рядом Mandarin.exe.sig.
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller qrcode python-docx

      - name: Run tests
        shell: bash
        run: |
          set +e
          fail=0
          for t in engine pdftools license antitamper integrity sales; do
            echo "========== test_$t ==========" | tee -a tests.log
            python -X utf8 tests/test_$t.py >> tests.log 2>&1
            code=$?
            echo "exit=$code" | tee -a tests.log
            [ $code -ne 0 ] && fail=1
          done
          echo "---- последние строки ----"
          tail -c 6000 tests.log
          exit $fail
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: tests.log
      - name: Publish test log into repo on failure
        if: failure()
        shell: bash
        run: |
          git config user.email "ci@mandarin.local"
          git config user.name "mandarin-ci"
          mkdir -p ci-logs && cp tests.log ci-logs/last-failure.txt
          git add ci-logs/last-failure.txt
          git commit -m "CI: лог упавших тестов [skip ci]" || exit 0
          git push origin HEAD:main

      # Секреты сборки: режим «платная» + настоящий перец. Файл _secret.py в репозиторий не попадает.
      - name: Inject build secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.MANDARIN_PEPPER }}" ] || [ -z "${{ secrets.MANDARIN_BUILD_KEY }}" ]; then
            echo "Добавьте секреты MANDARIN_PEPPER и MANDARIN_BUILD_KEY (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          printf 'FREE = "0"\nPEPPER = "%s"\n' "${{ secrets.MANDARIN_PEPPER }}" > _secret.py

      # PyInstaller onefile: один защищённый .exe. Nuitka не применим — PyMuPDF даёт C-файл на
      # 2,3 млн строк, на котором и MSVC, и gcc исчерпывают память. Защиту даёт подпись .exe
      # (файл-страж) + неподделываемые ключи Ed25519; платный режим — через вшитый _secret.py.
      - name: Build app (PyInstaller, платная версия)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name Mandarin --icon mandarin.ico
          --add-data "mandarin.ico;." --add-data "tessdata;tessdata" --add-data "_secret.py;."
          --hidden-import _secret --hidden-import pystray._win32
          --collect-all tkinterdnd2 --collect-all imageio_ffmpeg --collect-all pillow_heif
          --collect-all pymupdf --collect-all pdf2docx --collect-all docx --collect-all pptx
          --collect-all openpyxl --collect-all pyhanko --collect-all pyhanko_certvalidator
          app.py

      # Подпись сборки: рядом с .exe появляется Mandarin.exe.sig (файл-страж целостности)
      - name: Sign build
        shell: bash
        env:
          MANDARIN_BUILD_KEY: ${{ secrets.MANDARIN_BUILD_KEY }}
        run: python tools/sign_build.py dist/Mandarin.exe

      - name: Package portable zip
        shell: bash
        run: |
          powershell -NoProfile -Command "Compress-Archive -Path dist/Mandarin.exe,dist/Mandarin.exe.sig,uninstall.bat,uninstall.ps1 -DestinationPath Mandarin-portable.zip -Force"

      # Тестовая ветка: только приватный артефакт, БЕЗ публичного релиза.
      # Скачать: вкладка Actions → этот запуск → раздел Artifacts → «Mandarin».
      - name: Upload build (artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: Mandarin
          path: |
            dist/Mandarin.exe
            dist/Mandarin.exe.sig
            Mandarin-portable.zip
